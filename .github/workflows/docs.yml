name: Generate and publish API JavaDocs
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Every run of this workflow pushes to the same gh-pages branch, so two of them
# in flight together race to update the ref and the loser is rejected with
# "cannot lock ref 'refs/heads/gh-pages'". A release pushes several commits to
# main in quick succession, which is exactly when that happens. Queue the runs
# instead of cancelling them, so a publish that has already started finishes.
# The group deliberately leaves out the ref: the branch being published to is
# the same one no matter which ref triggered the run.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: 11
    - name: Cache Maven packages
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}

    - name: Generate docs
      run: mvn javadoc:javadoc

    - name: Deploy docs
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./target/reports/apidocs
